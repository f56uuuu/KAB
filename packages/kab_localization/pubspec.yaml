name: kab_localization
description: Static (ARB/intl) + dynamic (CMS) localization and RTL/LTR direction handling for all KAB apps.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.6
  kab_core:
    path: ../kab_core

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
