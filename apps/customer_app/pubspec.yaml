name: kab_customer_app
description: KAB — customer-facing app (ride, delivery, marketplace, gifts).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.6
  kab_core:
    path: ../../packages/kab_core
  kab_design_system:
    path: ../../packages/kab_design_system
  kab_localization:
    path: ../../packages/kab_localization
  kab_maps:
    path: ../../packages/kab_maps
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/icon/

flutter_launcher_icons:
  # Generates the real Android/iOS app icons from the official KAP brand icon.
  # Run: dart run flutter_launcher_icons
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
