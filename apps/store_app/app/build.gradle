plugins {
    id 'com.android.application'
}

android {
    namespace 'app.kap.store'
    compileSdk 34

    defaultConfig {
        applicationId 'app.kap.store'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // sideloaded store devices: signed with the build machine's key (kept by the CI cache)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
