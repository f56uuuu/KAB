name: Store app (Android)

# Builds the KAP store-device app and publishes it on the website as /kap-store.apk
on:
  push:
    branches: [main]
    paths:
      - 'apps/store_app/**'
      - '.github/workflows/store-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # keeps the same signing key between builds, so updates install over the old app
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kap-store-signing-v1

      - name: App icon
        run: |
          mkdir -p apps/store_app/app/src/main/res/mipmap-xxxhdpi
          cp apps/web_app/public/icon-192.png apps/store_app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build
        working-directory: apps/store_app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish to the website
        run: |
          cp apps/store_app/app/build/outputs/apk/release/app-release.apk apps/web_app/public/kap-store.apk
          git config user.name "kap-build"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web_app/public/kap-store.apk
          git commit -m "Store app build ${GITHUB_SHA::7}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: kap-store-apk
          path: apps/web_app/public/kap-store.apk
